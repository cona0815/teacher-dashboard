[build]
  publish = "."

# The repository keeps the original Apps Script filename `Index.html`.
# Rewrite the site root so Netlify can still serve it as the homepage.
[[redirects]]
  from = "/"
  to = "/Index.html"
  status = 200

# Teacher-first static app: browser data stays local; the desktop companion
# communicates only through the loopback address 127.0.0.1.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self)"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self' data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://generativelanguage.googleapis.com https://script.google.com https://script.googleusercontent.com http://127.0.0.1:8767; object-src 'none'; base-uri 'self'; form-action 'self'"
