[build]
  publish = "."

# The repository keeps the original Apps Script filename `Index.html`.
# Rewrite the site root so Netlify can still serve it as the homepage.
[[redirects]]
  from = "/"
  to = "/Index.html"
  status = 200

# Teacher-first static app: browser data stays local; the desktop companion
# communicates only through the loopback address 127.0.0.1.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self)"
    Cross-Origin-Opener-Policy = "same-origin"
    # 防點擊劫持：外站不能把本站頁面塞進 iframe 誘導老師誤點。
    # 用 SAMEORIGIN／'self' 而不是 DENY／'none'，因為安裝教學頁會用 iframe 嵌自家的 Code.gs。
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self' data: blob:; frame-ancestors 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://generativelanguage.googleapis.com https://api.openai.com https://api.x.ai https://script.google.com https://script.googleusercontent.com http://127.0.0.1:8767; object-src 'none'; base-uri 'self'; form-action 'self'"
