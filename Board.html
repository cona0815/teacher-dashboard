<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>六年級學年主任＋導師｜電子紙看板</title>
  <style>
    :root {
      --paper: #f4efe6;
      --surface: #fffdf8;
      --ink: #2f3b37;
      --muted: #6d7973;
      --line: #d8cfc1;
      --forest: #355e59;
      --forest-dark: #284a46;
      --forest-soft: #e3ece7;
      --terracotta: #c46e52;
      --terracotta-soft: #f4dfd5;
      --gold: #b48b3d;
      --gold-soft: #f3ead1;
      --gap: clamp(9px, 1.15vh, 18px);
      --radius: clamp(15px, 1.8vh, 26px);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--ink); font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at 8% 5%, #fbf7ef 0 14%, transparent 35%), var(--paper);
    }
    button { font: inherit; }
    .board {
      width: 100vw; height: 100dvh; min-height: 100vh; display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr) auto auto;
      gap: var(--gap); padding: clamp(12px, 1.45vh, 25px) clamp(12px, 2.2vw, 30px);
    }
    .topbar {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center;
      padding: clamp(12px, 1.6vh, 20px); border: 2px solid var(--forest-dark); border-radius: var(--radius);
      background: linear-gradient(135deg, var(--forest-dark), var(--forest)); color: white;
      box-shadow: 0 5px 0 rgba(53,94,89,.16);
    }
    .brand { display: flex; align-items: center; gap: clamp(10px, 1.5vw, 18px); min-width: 0; }
    .brand-icon { width: clamp(48px, 7vh, 80px); height: clamp(48px, 7vh, 80px); padding: 8px; flex: 0 0 auto; border-radius: 22px; background: #fffaf1; transform: rotate(-2deg); }
    .eyebrow { margin: 0 0 3px; opacity: .76; font-size: clamp(10px, 1.15vh, 15px); font-weight: 900; letter-spacing: .12em; }
    h1 { margin: 0; font-size: clamp(24px, 3.35vh, 47px); line-height: 1.06; font-weight: 950; }
    .date { text-align: right; white-space: nowrap; }
    .date-main { font-size: clamp(17px, 2.2vh, 29px); font-weight: 950; }
    .date-sub { margin-top: 4px; opacity: .75; font-size: clamp(10px, 1.3vh, 16px); font-weight: 850; }
    .focus {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: clamp(10px, 1.7vw, 18px);
      padding: clamp(11px, 1.55vh, 22px); border: 2px solid #d89a7f; border-radius: var(--radius); background: var(--terracotta-soft);
    }
    .focus-icon { width: clamp(43px, 6vh, 69px); height: clamp(43px, 6vh, 69px); padding: 6px; border-radius: 18px; background: var(--surface); transform: rotate(2deg); }
    .focus-label { margin: 0 0 3px; color: var(--terracotta); font-size: clamp(9px, 1.1vh, 14px); font-weight: 950; letter-spacing: .12em; }
    .focus-text { margin: 0; font-size: clamp(17px, 2.2vh, 29px); line-height: 1.25; font-weight: 950; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .focus-count { min-width: 60px; text-align: center; color: var(--terracotta); }
    .focus-count strong { display: block; font-size: clamp(30px, 4.5vh, 55px); line-height: .9; }
    .focus-count span { display: block; margin-top: 5px; color: var(--ink); font-size: clamp(8px, 1.05vh, 13px); font-weight: 900; }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(7px, 1.2vw, 13px); }
    .kpi { min-height: clamp(60px, 7.8vh, 94px); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 9px; padding: clamp(8px, 1.1vh, 14px); border: 2px solid var(--line); border-radius: 18px; background: var(--surface); }
    .kpi:nth-child(2) { background: var(--gold-soft); border-color: #dac58d; }
    .kpi:nth-child(3) { background: var(--terracotta-soft); border-color: #deb19d; }
    .kpi:nth-child(4) { background: var(--forest-soft); border-color: #a9c2b7; }
    .kpi-icon { width: clamp(30px, 4.3vh, 48px); height: clamp(30px, 4.3vh, 48px); }
    .kpi-label { color: var(--muted); font-size: clamp(9px, 1.2vh, 15px); font-weight: 900; }
    .kpi-value { font-size: clamp(25px, 3.6vh, 44px); line-height: .85; font-weight: 950; }
    .task-panel { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); border: 2px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: clamp(8px, 1.1vh, 14px) clamp(11px, 1.8vw, 18px); border-bottom: 2px dashed var(--line); background: #faf5eb; }
    .panel-heading { display: flex; align-items: center; gap: 9px; }
    .panel-icon { width: clamp(30px, 4vh, 44px); height: clamp(30px, 4vh, 44px); }
    .panel-title { margin: 0; font-size: clamp(16px, 2.1vh, 26px); font-weight: 950; }
    .panel-meta { color: var(--muted); font-size: clamp(9px, 1.1vh, 14px); font-weight: 850; white-space: nowrap; }
    .task-list { min-height: 0; display: grid; grid-auto-rows: minmax(0, 1fr); padding: 0 clamp(11px, 1.8vw, 18px); overflow: hidden; }
    .task-row { min-height: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: clamp(7px, 1.5vw, 14px); padding: clamp(6px, .92vh, 12px) 0; border-bottom: 1px dashed var(--line); }
    .task-row:last-child { border-bottom: 0; }
    .rank { width: clamp(33px, 4.6vh, 53px); aspect-ratio: 1; display: grid; place-items: center; border: 2px solid var(--forest); border-radius: 12px 17px 13px 15px; color: var(--forest); background: var(--forest-soft); font-size: clamp(14px, 1.95vh, 24px); font-weight: 950; }
    .task-row.urgent .rank { border-color: var(--terracotta); background: var(--terracotta); color: white; }
    .task-main { min-width: 0; }
    .task-name { margin: 0; font-size: clamp(14px, 1.9vh, 23px); line-height: 1.2; font-weight: 950; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-detail { min-width: 0; display: flex; gap: 6px; align-items: center; margin-top: 5px; color: var(--muted); font-size: clamp(9px, 1.2vh, 15px); font-weight: 800; white-space: nowrap; overflow: hidden; }
    .category { flex: 0 0 auto; padding: 2px 7px; border: 1.5px solid var(--gold); border-radius: 999px; color: #7d611f; background: var(--gold-soft); font-weight: 950; }
    .detail-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .task-side { max-width: 135px; text-align: right; }
    .status { display: inline-block; max-width: 100%; padding: 3px 8px; border: 1.7px solid var(--forest); border-radius: 999px; color: var(--forest); background: var(--forest-soft); font-size: clamp(8px, 1.1vh, 14px); font-weight: 950; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status.waiting { border-color: var(--gold); color: #765918; background: var(--gold-soft); border-style: dashed; }
    .due { margin-top: 5px; color: var(--muted); font-size: clamp(8px, 1.05vh, 13px); font-weight: 850; white-space: nowrap; }
    .timeline { min-height: clamp(96px, 13vh, 155px); display: grid; grid-template-columns: auto minmax(0, 1fr); border: 2px solid #a9c2b7; border-radius: var(--radius); background: var(--surface); overflow: hidden; }
    .timeline-label { display: grid; place-items: center; padding: 9px 12px; background: var(--forest); color: white; writing-mode: vertical-rl; font-size: clamp(12px, 1.65vh, 20px); font-weight: 950; letter-spacing: .12em; }
    .timeline-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .timeline-item { min-width: 0; padding: clamp(9px, 1.2vh, 15px) clamp(8px, 1.3vw, 13px); border-right: 1px dashed var(--line); }
    .timeline-item:last-child { border-right: 0; }
    .timeline-time { color: var(--terracotta); font-size: clamp(16px, 2.2vh, 27px); font-weight: 950; }
    .timeline-title { margin-top: 7px; font-size: clamp(11px, 1.42vh, 17px); line-height: 1.25; font-weight: 950; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .timeline-note { margin-top: 5px; color: var(--muted); font-size: clamp(8px, 1vh, 12px); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    footer { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 9px; padding-top: clamp(6px, .75vh, 10px); border-top: 1px dashed var(--line); color: var(--muted); font-size: clamp(8px, 1vh, 13px); font-weight: 800; }
    .source { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .refresh { min-height: 30px; padding: 4px 12px; border: 1.5px solid var(--forest); border-radius: 999px; background: var(--forest-soft); color: var(--forest); font-size: inherit; font-weight: 950; cursor: pointer; }
    .empty { height: 100%; display: grid; place-items: center; padding: 20px; text-align: center; color: var(--muted); font-size: clamp(15px, 2vh, 24px); font-weight: 850; }
    @media (max-width: 560px) { .board { padding-left: 9px; padding-right: 9px; } .brand-icon, .eyebrow { display: none; } .focus { grid-template-columns: auto minmax(0, 1fr); } .focus-count { display: none; } .kpi { grid-template-columns: 1fr; } .kpi-icon { display: none; } .task-side { max-width: 95px; } .timeline-note { display: none; } }
  </style>
</head>
<body>
  <main class="board">
    <header class="topbar">
      <div class="brand">
        <img class="brand-icon" src="assets/koboyo/teacher-group-students.svg" alt="教師與學生">
        <div><p class="eyebrow" id="eyebrow">GRADE 6 TEAM LEAD &amp; HOMEROOM</p><h1 id="title">六年級學年主任＋導師｜每日看板</h1></div>
      </div>
      <div class="date"><div class="date-main" id="dateMain">今天</div><div class="date-sub" id="dateSub">臺南時間</div></div>
    </header>
    <section class="focus">
      <img class="focus-icon" src="assets/koboyo/parent-teacher-association.svg" alt="協調溝通">
      <div><p class="focus-label">TODAY'S FOCUS｜今天最重要</p><p class="focus-text" id="focusText">正在整理今天的工作重點…</p></div>
      <div class="focus-count"><strong id="focusCount">0</strong><span>項看板任務</span></div>
    </section>
    <section class="kpis">
      <article class="kpi"><img class="kpi-icon" src="assets/koboyo/teacher-checking-list.svg" alt="急件"><span class="kpi-label">高優先</span><strong class="kpi-value" id="urgent">0</strong></article>
      <article class="kpi"><img class="kpi-icon" src="assets/koboyo/parent-teacher-association.svg" alt="等待回覆"><span class="kpi-label">等待他人</span><strong class="kpi-value" id="waiting">0</strong></article>
      <article class="kpi"><img class="kpi-icon" src="assets/koboyo/academic-year-planner.svg" alt="今天到期"><span class="kpi-label">今天截止</span><strong class="kpi-value" id="dueToday">0</strong></article>
      <article class="kpi"><img class="kpi-icon" src="assets/koboyo/graduation-cap-scroll.svg" alt="今天完成"><span class="kpi-label">今天完成</span><strong class="kpi-value" id="doneToday">0</strong></article>
    </section>
    <section class="task-panel">
      <div class="panel-header"><div class="panel-heading"><img class="panel-icon" src="assets/koboyo/teacher-checking-list.svg" alt="工作清單"><h2 class="panel-title">今日工作清單</h2></div><div class="panel-meta" id="taskMeta">讀取中…</div></div>
      <div class="task-list" id="taskList"><div class="empty">正在整理工作清單…</div></div>
    </section>
    <section class="timeline"><div class="timeline-label">今日時程</div><div class="timeline-list" id="timelineList"><article class="timeline-item"><div class="timeline-title">正在讀取今天的時程…</div></article></div></section>
    <footer><div class="source" id="source">資料來源：Workspace 任務系統</div><button class="refresh" type="button" id="refreshButton">重新整理</button></footer>
  </main>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    let refreshTimer = null;

    if (!window.google || !window.google.script || !window.google.script.run) {
      // 非 GAS 環境：直接讀「同一個瀏覽器」裡教師工作台的真實任務（localStorage 同網域共用）。
      const readLocal = key => { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (error) { return null; } };
      const localDateKey = date => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      const buildLocalBoardData = () => {
        const all = (readLocal('grade6PreviewTasks') || []).filter(task => task && task.name && task.status !== '封存');
        const settings = readLocal('grade6AssistantSettings') || {};
        const today = localDateKey(new Date());
        const active = all.filter(task => !['已完成', '取消'].includes(task.status));
        const shown = active
          .filter(task => task.boardDisplay !== '隱藏')
          .sort((a, b) => {
            const forceDiff = (b.boardDisplay === '強制顯示' ? 1 : 0) - (a.boardDisplay === '強制顯示' ? 1 : 0);
            if (forceDiff) return forceDiff;
            const overdueDiff = ((a.dueDate && a.dueDate < today) ? 0 : 1) - ((b.dueDate && b.dueDate < today) ? 0 : 1);
            if (overdueDiff) return overdueDiff;
            const priorityDiff = (a.priority === '高' ? 0 : 1) - (b.priority === '高' ? 0 : 1);
            if (priorityDiff) return priorityDiff;
            return String(a.dueDate || '9999').localeCompare(String(b.dueDate || '9999'));
          })
          .slice(0, 8);
        return {
          office: {
            schoolName: settings.workspace && settings.workspace.title ? settings.workspace.title : '教師工作台',
            name: settings.teacher && settings.teacher.title ? settings.teacher.title : '',
            roleName: '本機資料・與工作台同步'
          },
          refreshMinutes: 5,
          tasks: shown,
          timeline: active.filter(task => task.dueDate === today && task.dueTime)
            .sort((a, b) => String(a.dueTime).localeCompare(String(b.dueTime))),
          summary: {
            urgent: active.filter(task => task.priority === '高').length,
            waiting: active.filter(task => ['等待他人', '待確認', '等待回覆'].includes(task.status)).length,
            dueToday: active.filter(task => task.dueDate === today).length,
            doneToday: all.filter(task => task.status === '已完成').length,
            active: active.length
          },
          sourceName: '本機教師工作台（此瀏覽器）',
          serverTime: new Date().toLocaleString('zh-TW', { hour12: false }),
          emptyHint: all.length ? '' : '這個瀏覽器還沒有工作台資料——請先在同一台電腦、同一個瀏覽器開啟 Index.html 建立任務。'
        };
      };
      const previewRun = { _success: null, _failure: null, withSuccessHandler(fn) { this._success = fn; return this; }, withFailureHandler(fn) { this._failure = fn; return this; }, getBoardData() { setTimeout(() => this._success && this._success(buildLocalBoardData()), 60); } };
      window.google = { script: { run: previewRun } };
    }

    function escapeHtml(value) { return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
    function serverCall(functionName, ...args) { return new Promise((resolve, reject) => { const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(error => reject(new Error(error && error.message ? error.message : String(error)))); runner[functionName](...args); }); }
    function updateClock() { const now = new Date(); $('dateMain').textContent = new Intl.DateTimeFormat('zh-TW', { month: 'numeric', day: 'numeric', weekday: 'short' }).format(now); $('dateSub').textContent = `臺南時間 ${new Intl.DateTimeFormat('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false }).format(now)}`; }
    function dueText(task) { if (!task.dueDate) return '尚未設定'; const parts = task.dueDate.split('-'); const date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 12); const now = new Date(); const today = date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth() && date.getDate() === now.getDate(); const time = task.dueTime ? ` ${task.dueTime}` : ''; return today ? `今天${time}` : `${Number(parts[1])}/${Number(parts[2])}${time}`; }
    function renderTasks(tasks) { if (!tasks.length) { $('taskList').innerHTML = '<div class="empty">今天沒有需要顯示的任務，辛苦了！</div>'; return; } $('taskList').innerHTML = tasks.map((task, index) => { const urgentClass = task.priority === '高' ? 'urgent' : ''; const waitingClass = ['等待他人', '等待回覆'].includes(task.status) ? 'waiting' : ''; const detail = task.nextAction || task.progress || '確認內容並完成下一步'; return `<article class="task-row ${urgentClass}"><div class="rank">${String.fromCharCode(65 + index)}</div><div class="task-main"><h3 class="task-name">${escapeHtml(task.name)}</h3><div class="task-detail"><span class="category">${escapeHtml(task.category)}</span><span class="detail-text">${escapeHtml(detail)}</span></div></div><div class="task-side"><span class="status ${waitingClass}">${escapeHtml(task.status)}</span><div class="due">${escapeHtml(dueText(task))}</div></div></article>`; }).join(''); }
    function renderTimeline(items) { if (!items.length) { $('timelineList').innerHTML = '<article class="timeline-item"><div class="timeline-time">—</div><div class="timeline-title">今天沒有設定時間的工作</div><div class="timeline-note">可從管理台補上截止時間</div></article>'; return; } $('timelineList').innerHTML = items.map(task => `<article class="timeline-item"><div class="timeline-time">${escapeHtml(task.dueTime)}</div><div class="timeline-title">${escapeHtml(task.name)}</div><div class="timeline-note">${escapeHtml(task.category)}・${escapeHtml(task.status)}</div></article>`).join(''); }
    function render(data) { const tasks = data.tasks || []; const summary = data.summary || {}; const office = data.office || {}; $('title').textContent = '六年級學年主任＋導師｜每日看板'; $('eyebrow').textContent = [office.schoolName, office.name, office.roleName].filter(Boolean).join(' / ') || 'GRADE 6 TEAM LEAD & HOMEROOM'; $('urgent').textContent = summary.urgent || 0; $('waiting').textContent = summary.waiting || 0; $('dueToday').textContent = summary.dueToday || 0; $('doneToday').textContent = summary.doneToday || 0; $('focusCount').textContent = tasks.length; $('taskMeta').textContent = `${tasks.length} 項看板任務・共 ${summary.active || 0} 項進行中`; $('focusText').textContent = tasks.length ? `${tasks[0].name}${tasks[0].nextAction ? `：${tasks[0].nextAction}` : ''}` : (data.emptyHint || '今天沒有急件，可以安心處理教學與班級事務。'); $('source').textContent = `資料來源：${data.sourceName || 'Workspace 任務系統'}｜更新 ${data.serverTime || ''}`; renderTasks(tasks); renderTimeline(data.timeline || []); scheduleRefresh(Number(data.refreshMinutes) || 10); updateClock(); }
    function scheduleRefresh(minutes) { window.clearTimeout(refreshTimer); refreshTimer = window.setTimeout(loadBoard, Math.max(minutes, 1) * 60 * 1000); }
    async function loadBoard() { $('source').textContent = '資料來源：正在同步 Workspace 任務系統…'; try { render(await serverCall('getBoardData')); } catch (error) { $('source').textContent = `讀取失敗：${error.message}`; $('taskList').innerHTML = `<div class="empty">${escapeHtml(error.message)}<br>請稍後重新整理。</div>`; scheduleRefresh(3); } }
    $('refreshButton').addEventListener('click', loadBoard); updateClock(); window.setInterval(updateClock, 60 * 1000); loadBoard();
  </script>
</body>
</html>
