name: Build XiaoMianZhu for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "xiaomianzhu-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r requirements.txt
      - name: Build portable application
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --windowed --onedir `
            --name XiaoMianZhu `
            --add-data "assets/pet;assets/pet" `
            --add-data "windows_ocr.ps1;." `
            --hidden-import pypdf --hidden-import docx `
            --hidden-import openpyxl --hidden-import pptx `
            desktop_pet_secretary.py
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md,SECURITY.md,README.md -Destination dist/XiaoMianZhu
          Compress-Archive -Path dist/XiaoMianZhu/* -DestinationPath xiaomianzhu-windows-portable.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: xiaomianzhu-windows-portable
          path: xiaomianzhu-windows-portable.zip
          if-no-files-found: error
      - name: Attach ZIP to tagged release
        if: startsWith(github.ref, 'refs/tags/xiaomianzhu-v')
        uses: softprops/action-gh-release@v2
        with:
          files: xiaomianzhu-windows-portable.zip
          generate_release_notes: true
