<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>螢幕公告</title>
<style>
/* 字型都在本站（只有選到才會下載） */
@font-face{font-family:"Huninn";font-display:swap;src:local("Huninn"),local("Huninn Regular"),url("assets/fonts/Huninn-Regular.ttf") format("truetype")}
@font-face{font-family:"Iansui";font-display:swap;src:local("Iansui"),local("Iansui Regular"),url("assets/fonts/Iansui-Regular.ttf") format("truetype")}
@font-face{font-family:"Bpmf Huninn";font-display:swap;src:local("Bpmf Huninn"),local("Bpmf Huninn Regular"),url("assets/fonts/BpmfHuninn-Regular.ttf") format("truetype")}
@font-face{font-family:"Bpmf Iansui";font-display:swap;src:local("Bpmf Iansui"),local("Bpmf Iansui Regular"),url("assets/fonts/BpmfIansui-Regular.ttf") format("truetype")}
/* 版面：全螢幕畫布＋自由擺放的小工具視窗＋底部工具列；位置以畫布百分比儲存，換投影機解析度也不跑版。
   三種風格各是完整的單一外觀，由 body[data-style] 切換。 */
:root{
  color-scheme:dark;
  --bg:#24392f; --bg-img:radial-gradient(ellipse at 25% 15%,rgba(255,255,255,.07),transparent 55%),radial-gradient(ellipse at 85% 95%,rgba(0,0,0,.3),transparent 55%);
  --card:rgba(12,26,19,.5); --card-solid:#1c2f25; --card-border:2px dashed rgba(240,236,224,.34); --radius:12px; --shadow:none;
  --chrome:rgba(240,236,224,.16); --chrome-ink:#f1eee4;
  --bar:rgba(18,32,25,.9); --bar-edge:rgba(240,236,224,.25);
  --ink:#f1eee4; --muted:#b4c0af; --accent:#f7d86a; --on-accent:#1f2e26; --hot:#ff9a86; --on-hot:#24392f;
  --digit:#f7d86a; --glow:0 0 1px rgba(255,255,255,.5);
  --rule:1px dashed rgba(240,236,224,.2);
  --btn-bg:rgba(255,255,255,.07); --btn-ink:#f1eee4; --btn-edge:rgba(240,236,224,.35); --btn-radius:6px;
  --field:rgba(0,0,0,.25); --track:rgba(255,255,255,.13); --stage:rgba(0,0,0,.2);
  --title-font:"DFKai-SB","Kaiti TC","DFKai-SB",serif;
  --body-font:"DFKai-SB","Kaiti TC","DFKai-SB",serif;
  --digit-font:"Segoe Print","DFKai-SB",cursive;
}
body[data-style="cork"]{
  color-scheme:light;
  --bg:#c39a6b; --bg-img:radial-gradient(circle at 20% 30%,rgba(110,70,30,.35) 1.2px,transparent 2.2px),radial-gradient(circle at 70% 60%,rgba(255,235,200,.25) 1px,transparent 2px),radial-gradient(circle at 40% 80%,rgba(90,55,20,.3) 1.5px,transparent 2.5px);
  --card:#fffcf4; --card-solid:#fffcf4; --card-border:none; --radius:6px; --shadow:0 8px 18px rgba(70,40,10,.35);
  --chrome:#efe4cf; --chrome-ink:#2c2118;
  --bar:rgba(255,252,244,.94); --bar-edge:#d9c8ad;
  --ink:#2c2118; --muted:#7a6650; --accent:#c8402c; --on-accent:#fff; --hot:#c8402c; --on-hot:#fff;
  --digit:#2c2118; --glow:none;
  --rule:1px solid #eee3cf;
  --btn-bg:#fffcf4; --btn-ink:#2c2118; --btn-edge:#d9c8ad; --btn-radius:999px;
  --field:#fff; --track:#eadfcb; --stage:#f3ecdf;
  --title-font:"Microsoft JhengHei","PingFang TC","Microsoft JhengHei",sans-serif;
  --body-font:"Microsoft JhengHei","PingFang TC","Microsoft JhengHei",sans-serif;
  --digit-font:"Segoe UI","Microsoft JhengHei",sans-serif;
}
body[data-style="led"]{
  color-scheme:dark;
  --bg:#0a0c0f; --bg-img:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  --card:#11151a; --card-solid:#11151a; --card-border:1px solid #232b34; --radius:10px; --shadow:0 10px 30px rgba(0,0,0,.45);
  --chrome:#1b222a; --chrome-ink:#e9eef3;
  --bar:rgba(14,17,21,.94); --bar-edge:#2c3640;
  --ink:#e9eef3; --muted:#7f8c99; --accent:#ffb000; --on-accent:#120d00; --hot:#ff4040; --on-hot:#fff;
  --digit:#ffb000; --glow:0 0 18px rgba(255,176,0,.5),0 0 2px rgba(255,200,80,.9);
  --rule:1px solid #1e252d;
  --btn-bg:#161c22; --btn-ink:#e9eef3; --btn-edge:#2c3640; --btn-radius:6px;
  --field:#0c1014; --track:#1d242c; --stage:#080a0d;
  --title-font:"Microsoft JhengHei","PingFang TC","Microsoft JhengHei",sans-serif;
  --body-font:"Microsoft JhengHei","PingFang TC","Microsoft JhengHei",sans-serif;
  --digit-font:"Consolas","Microsoft JhengHei",monospace;
}
/* 小島：草地圓點、奶油色對話框卡片、圓體字，溫暖的悠閒島嶼生活感（原創設計） */
body[data-style="isle"]{
  color-scheme:light;
  --bg:#8fd16a; --bg-img:radial-gradient(circle at 25% 25%,rgba(255,255,255,.22) 0 9px,transparent 10px),radial-gradient(circle at 75% 75%,rgba(255,255,255,.22) 0 9px,transparent 10px);
  --card:#fffbe8; --card-solid:#fffbe8; --card-border:4px solid #fff3c4; --radius:30px; --shadow:0 7px 0 rgba(84,120,50,.35),0 12px 24px rgba(40,70,20,.18);
  --chrome:#f6e7b4; --chrome-ink:#6b4e2e;
  --bar:rgba(255,251,232,.96); --bar-edge:#ecdba4;
  --ink:#6b4e2e; --muted:#a58b68; --accent:#18b48a; --on-accent:#fff; --hot:#f2665a; --on-hot:#fff;
  --digit:#6b4e2e; --glow:none;
  --rule:2px dotted #eadcae;
  --btn-bg:#fff6d6; --btn-ink:#6b4e2e; --btn-edge:#e9d596; --btn-radius:999px;
  --field:#fff; --track:#f1e6c2; --stage:#f7efd2;
  --title-font:"Huninn","Segoe UI","Microsoft JhengHei",sans-serif;
  --body-font:"Huninn","Microsoft JhengHei",sans-serif;
  --digit-font:"Segoe UI","Huninn",sans-serif;
}
body[data-style="isle"] #stage{background-size:56px 56px}
body[data-style="isle"] .wh{border-radius:14px 14px 0 0}
body[data-style="isle"] .sch .tm{color:var(--accent)}
body[data-style="isle"] .sch li.now{background:#fff1b0;border-radius:14px}
body[data-style="isle"] .ttl{color:var(--accent)}
body[data-style="isle"] .btn.primary,body[data-style="isle"] .btn[aria-pressed="true"]{box-shadow:0 3px 0 #0f8a69}
body[data-style="isle"] #bar{border-radius:26px;border-width:3px}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body-font);font-size:16px}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#stage{position:fixed;inset:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:var(--bg);background-image:var(--bg-img);overflow:hidden}
body[data-style="cork"] #stage{background-size:22px 22px,31px 31px,17px 17px}
body[data-style="led"] #stage{background-size:28px 28px}
#stage.photo{background-size:cover!important;background-position:center!important}
body[data-style="chalk"] #stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 0 12px #6a4a2c,inset 0 0 0 14px #3c2816,inset 0 0 40px rgba(0,0,0,.45)}
.hint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:1.3rem;line-height:1.8;pointer-events:none;z-index:2}

/* 小工具視窗 */
.w{position:absolute;background:var(--card);border:var(--card-border);border-radius:var(--radius);box-shadow:var(--shadow);color:var(--ink)}
body[data-style="chalk"] .w{backdrop-filter:blur(2px)}
body[data-style="cork"] .w::before{content:"";position:absolute;top:-7px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#b8281a 60%,#7a140a);box-shadow:0 3px 4px rgba(0,0,0,.35);z-index:4}
.w.sel{outline:2px solid var(--accent);outline-offset:2px}
.wh{position:absolute;left:0;right:0;bottom:100%;height:32px;pointer-events:none;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 4px 0 10px;background:var(--chrome);color:var(--chrome-ink);border-radius:10px 10px 0 0;opacity:0;transition:opacity .15s;cursor:grab;z-index:6;box-shadow:0 -2px 8px rgba(0,0,0,.2);font-size:.82rem;touch-action:none;user-select:none}
.wh:active{cursor:grabbing}
.w:hover .wh,.w.sel .wh,.w.setting .wh{opacity:1;pointer-events:auto}
.w.toped .wh{bottom:auto;top:100%;border-radius:0 0 10px 10px}
.w::after{content:"";position:absolute;left:0;right:0;bottom:100%;height:34px}
.w.toped::after{bottom:auto;top:100%}
.w:not(:hover):not(.sel)::after{pointer-events:none}
.wh .wt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.wh .wbs{display:flex;gap:2px;flex:none}
.wh button{border:0;background:transparent;color:inherit;cursor:pointer;padding:3px 7px;border-radius:5px;font-size:.82rem;line-height:1}
.wh button:hover{background:rgba(127,127,127,.25)}
.wh button.on{background:var(--accent);color:var(--on-accent)}
.wb{position:absolute;inset:0;padding:clamp(8px,4cqmin,22px);container-type:size;overflow:hidden;display:flex;flex-direction:column;--fs:1}
.wr{position:absolute;right:0;bottom:0;width:24px;height:24px;cursor:nwse-resize;opacity:0;touch-action:none;z-index:5;background:linear-gradient(135deg,transparent 55%,var(--accent) 55%);border-radius:0 0 var(--radius) 0}
.w:hover .wr,.w.sel .wr{opacity:.85}
.wset{position:absolute;inset:0;background:var(--card-solid);z-index:4;overflow:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px;font-size:.92rem;border-radius:var(--radius)}
.frow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.frow>span:first-child{color:var(--muted);min-width:4.5em}
.frow input[type="text"],.frow input[type="number"],.frow input[type="time"],.frow input[type="url"],.frow textarea{flex:1;min-width:6em;padding:6px 8px;border-radius:6px;border:1px solid var(--btn-edge);background:var(--field)}
.frow input[type="number"]{max-width:6em}
.frow textarea{width:100%;resize:vertical;line-height:1.5}
.frow.col{flex-direction:column;align-items:stretch}
.erow{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center}
.erow input[type="time"]{padding:4px 6px;border-radius:6px;border:1px solid var(--btn-edge);background:var(--field)}
.erow input[type="text"]{min-width:0;padding:5px 8px;border-radius:6px;border:1px solid var(--btn-edge);background:var(--field)}
.erow .x{display:flex;gap:3px}
.erow .btn{padding:3px 7px;font-size:.78rem}

.btn{font-size:.9rem;padding:6px 12px;border-radius:var(--btn-radius);border:1px solid var(--btn-edge);background:var(--btn-bg);color:var(--btn-ink);cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn.primary,.btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--hot);border-color:var(--hot)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--btn-edge);border-radius:var(--btn-radius);overflow:hidden;background:var(--btn-bg)}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;color:var(--btn-ink);font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}

/* 小工具內容共用 */
.ctr{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5cqh;text-align:center}
.big{font-family:var(--digit-font);font-weight:700;color:var(--digit);text-shadow:var(--glow);font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.lbl{color:var(--muted);font-size:calc(var(--fs)*clamp(12px,min(8cqh,6cqw),40px));line-height:1.3}
.ttl{font-family:var(--title-font);font-weight:700;color:var(--accent);font-size:calc(var(--fs)*clamp(14px,min(9cqh,6cqw),44px));line-height:1.2}
.ctl{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.ctl .btn{font-size:calc(clamp(12px,min(6cqh,4.2cqw),20px))}
.bar{width:min(90%,700px);height:clamp(5px,2.6cqh,12px);border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s linear}
.urgent{color:var(--hot)!important;text-shadow:none!important;animation:pulse 1s ease-in-out infinite}
.bar.urg i{background:var(--hot)}
@keyframes pulse{50%{opacity:.45}}
@container (max-height:200px){.opt-tall{display:none!important}}
@container (max-height:120px){.opt-mid{display:none!important}}

/* 文字 */
#ink{position:absolute;inset:0;width:100%;height:100%;z-index:8000;pointer-events:none;touch-action:none}
#ink.on{pointer-events:auto;cursor:crosshair}
#ink.on.erase{cursor:cell}
#inkBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:9100;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;max-width:calc(100% - 24px);width:max-content;padding:8px 14px;border-radius:18px;background:var(--bar,var(--panel,#fffaf0));color:var(--ink);border:2px solid var(--bar-edge,var(--btn-edge));box-shadow:0 8px 24px rgba(0,0,0,.28)}
#inkBar[hidden]{display:none}
#inkBar .ink-group{display:flex;align-items:center;gap:6px}
#inkBar .btn[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
#inkBar .btn:disabled{opacity:.45;cursor:default}
.ink-size{width:34px;height:34px;padding:0;display:grid;place-items:center;border:2px solid var(--btn-edge);border-radius:50%;background:var(--btn-bg);cursor:pointer}
.ink-size i{display:block;border-radius:50%;background:var(--ink)}
.ink-size[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
.tb.on{background:var(--btn-bg);box-shadow:inset 0 0 0 2px var(--accent)}
.qrw{height:100%;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.qrpaper{flex:1;min-height:0;aspect-ratio:1;max-width:100%;display:grid;place-items:center;background:#fff;border-radius:8px;overflow:hidden}
.qrc{display:block;width:100%;height:100%;image-rendering:pixelated}
.qrc[hidden],.qrmsg[hidden],.qrcap[hidden]{display:none}
.qrmsg{padding:10px;color:#555;font-weight:700;text-align:center;font-size:calc(var(--fs)*clamp(13px,6cqw,22px));line-height:1.35}
.qrcap{font-family:var(--title-font);font-weight:700;color:var(--ink);text-align:center;font-size:calc(var(--fs)*clamp(13px,6cqw,26px));line-height:1.2}
.qrin{flex:none;width:100%;box-sizing:border-box;padding:5px 10px;border:1px solid var(--btn-edge);border-radius:8px;background:var(--field);color:var(--ink);font:inherit;font-size:clamp(12px,4.2cqw,18px);text-align:center;text-overflow:ellipsis}
.swatches{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.swatch{width:28px;height:28px;padding:0;border-radius:50%;border:2px solid var(--btn-edge);cursor:pointer}
.swatch[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.swatch-pick{display:inline-flex;align-items:center;gap:4px;font-size:.85rem;cursor:pointer}
.swatch-pick input{width:34px;height:28px;padding:0;border:1px solid var(--btn-edge);border-radius:6px;background:none;cursor:pointer}
.tx{scrollbar-width:none;flex:1;min-height:0;outline:none;font-family:var(--title-font);font-weight:700;font-size:calc(var(--fs)*clamp(16px,min(40cqh,7cqw),220px));line-height:1.25;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;display:grid;align-content:center;cursor:text}
/* 時鐘 */
.clk{font-size:calc(var(--fs)*min(42cqh,21cqw))}
.clk.s{font-size:calc(var(--fs)*min(40cqh,15cqw))}
.clk .sec{font-size:.42em;color:var(--muted);text-shadow:none;margin-left:.12em}
.anal{flex:1;min-height:0;width:100%}
/* 計時 */
.tdg{font-size:calc(var(--fs)*min(40cqh,22cqw))}
.laps{list-style:none;margin:0;padding:0;width:min(100%,22em);overflow:auto;max-height:30cqh;font-variant-numeric:tabular-nums;font-size:clamp(12px,5cqh,18px)}
.laps li{display:flex;justify-content:space-between;padding:2px 6px;border-bottom:var(--rule)}
/* 時程表 */
.sch{list-style:none;margin:0;padding:0;flex:1;min-height:0;overflow:auto;font-size:calc(var(--fs)*clamp(14px,4.3cqw,46px))}
.sch li{display:grid;grid-template-columns:auto 1fr auto;gap:.6em;align-items:baseline;padding:.28em .1em;border-bottom:var(--rule)}
.sch .tm{font-family:var(--digit-font);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;min-width:3.2em}
body[data-style="cork"] .sch .tm{color:var(--ink)}
.sch .st{font-size:.5em;color:var(--muted);white-space:nowrap}
.sch .tx2{overflow-wrap:anywhere;min-width:0}
.sch li.hot .tx2{color:var(--hot);font-weight:700}
.sch .tag{background:var(--hot);color:var(--on-hot);font-size:.55em;font-weight:700;padding:.1em .55em;border-radius:99px;margin-right:.4em;vertical-align:.2em}
.sch li.past{opacity:.4}
.sch li.now{background:rgba(127,127,127,.12)}
.sch li.now .st{color:var(--accent);font-weight:700}
body[data-style="cork"] .sch li.now{background:#fff2a1}
/* 鬧鐘 */
.al-list{list-style:none;margin:0;padding:0;font-size:clamp(12px,5cqh,18px);color:var(--muted)}
.al-list li.off{opacity:.45;text-decoration:line-through}
/* 圖片 */
.imgw{flex:1;min-height:0;display:grid;place-items:center;margin:calc(-1*clamp(8px,4cqmin,22px));border-radius:var(--radius);overflow:hidden;background:var(--stage)}
.imgw img{width:100%;height:100%;object-fit:contain;cursor:zoom-in;display:block}
.imgw img.cover{object-fit:cover}
.empty{color:var(--muted);text-align:center;line-height:1.7;padding:10px;font-size:clamp(12px,5cqmin,18px)}
.empty kbd{font-family:inherit;border:1px solid var(--btn-edge);border-radius:4px;padding:0 5px;color:var(--ink)}
/* 抽籤 */
.rres{font-family:var(--title-font);font-weight:700;color:var(--digit);text-shadow:var(--glow);font-size:calc(var(--fs)*min(36cqh,17cqw));line-height:1.1;overflow-wrap:anywhere;max-width:100%}
.rres.roll{opacity:.6}
.rres.got{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
/* 分組 */
.groups{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(110px,22cqw,220px),1fr));gap:8px;align-content:start;margin-top:8px;font-size:calc(var(--fs)*clamp(13px,3cqw,26px))}
.groups .empty{grid-column:1/-1}
.gc{border:1px solid var(--btn-edge);border-radius:8px;padding:6px 10px;background:var(--btn-bg)}
.gc b{display:block;color:var(--accent);margin-bottom:2px}
body[data-style="cork"] .gc{background:#fff2a1;border:none;box-shadow:0 2px 5px rgba(70,40,10,.18)}
/* 計分 */
.teams{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(110px,22cqw,240px),1fr));gap:8px;align-content:center}
.team{border:1px solid var(--btn-edge);border-radius:10px;padding:8px;text-align:center;background:var(--btn-bg);display:flex;flex-direction:column;align-items:center;gap:4px}
.team.lead{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.team .tn{font-weight:700;font-size:calc(var(--fs)*clamp(13px,3.4cqw,30px));overflow-wrap:anywhere}
.team .sc{font-size:calc(var(--fs)*clamp(26px,min(22cqh,9cqw),110px))}
.team .ld{font-size:.75rem;color:var(--accent);font-weight:700;min-height:1em}
.team .ctl .btn{padding:3px 9px}
body[data-style="cork"] .team{background:#fff;box-shadow:0 2px 6px rgba(70,40,10,.15)}
/* 投票 */

.lamp.r{background:#ff3b30;color:#ff3b30}.lamp.y{background:#ffcc00;color:#ffcc00}.lamp.g{background:#34c759;color:#34c759}
.lamp.on{opacity:1;box-shadow:0 0 28px currentColor}
.lmsg{font-family:var(--title-font);font-weight:900;font-size:calc(var(--fs)*min(14cqh,9cqw));line-height:1.15;max-width:60cqw;text-align:center}

.sym svg{width:min(55cqh,50cqw);height:min(55cqh,50cqw);stroke:var(--accent);stroke-width:1.6}
.symt{font-family:var(--title-font);font-weight:900;font-size:calc(var(--fs)*min(17cqh,12cqw));line-height:1.1}

.dice{display:flex;flex-wrap:wrap;gap:3cqw;justify-content:center;align-content:center;cursor:pointer}
.die{width:min(48cqh,calc(78cqw / var(--n)));aspect-ratio:1;background:#fdfdfb;border-radius:18%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:12%;box-shadow:0 6px 14px rgba(0,0,0,.35),inset 0 -4px 0 #ddd}

.die i.n{visibility:hidden}
.die.one i{background:#d62d20}
.die.shake{animation:shake .5s}

/* 音量 */
.nmsg{font-family:var(--title-font);font-weight:900;font-size:calc(var(--fs)*min(18cqh,10cqw))}
.nmeter{position:relative;width:min(92%,800px);height:clamp(12px,9cqh,44px);border-radius:99px;background:var(--track);overflow:hidden}
.nmeter i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#34c759,#ffcc00 60%,#ff3b30);transition:width .1s}
.nmeter b{position:absolute;top:0;bottom:0;width:3px;background:var(--ink)}
/* 畫板 */
.padw{flex:1;min-height:0;position:relative;border-radius:8px;overflow:hidden;background:var(--stage)}
.padw canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.ptools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.sw{width:1.4em;height:1.4em;border-radius:50%;display:inline-block;vertical-align:middle;border:2px solid rgba(127,127,127,.5)}

.qrbox{flex:1;min-height:0;width:100%;display:grid;place-items:center}
.qrbox>div{background:#fff;padding:3%;border-radius:8px;max-width:100%;max-height:100%;aspect-ratio:1;height:100%;display:grid;place-items:center}

#bar.hide{display:none}
.tb{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--ink);cursor:pointer;padding:6px 7px;border-radius:10px;font-size:.72rem;min-width:52px}
.tb:hover{background:var(--btn-bg)}

.tb .ic{height:22px;display:grid;place-items:center;font-weight:700;font-size:19px;line-height:1;color:var(--accent)}
.sep{width:1px;background:var(--bar-edge);margin:4px 4px;flex:none}
.scr{display:flex;align-items:center;gap:4px;padding:0 4px;flex:none}
.scr .nm{font-size:.82rem;max-width:10em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;background:transparent;border:1px dashed transparent;color:var(--ink);border-radius:8px;padding:2px 8px;cursor:pointer}

.scr .nm small{display:block;color:var(--muted);font-size:.7rem}

#barShow{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9000;opacity:.35;border-radius:99px}
#barShow:hover{opacity:1}
.pop{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:9100;width:min(420px,calc(100% - 28px));max-height:70vh;overflow:auto;background:var(--card-solid);border:1px solid var(--bar-edge);border-radius:14px;padding:14px;box-shadow:0 16px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px}

/* 外觀與定時面板 */
body.shot .wh,body.shot .wr{display:none!important}
body.shot .w.sel{outline:none}

.srow{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;padding:8px;border:1px solid var(--btn-edge);border-radius:8px}
.srow.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}

.srow .x{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap}
.srow .btn{padding:4px 9px;font-size:.8rem}
.srow .go{min-width:2.2em}
.btn:disabled{opacity:.35;cursor:default;filter:none}
.ring.calm{animation:none;background:var(--card-solid);color:var(--ink)}
.ring.calm .rbig{color:var(--accent);max-width:90vw;overflow-wrap:anywhere;white-space:pre-line;font-size:clamp(2.6rem,7.5vw,8rem);line-height:1.2}

/* 響鈴、放大、提示 */
.ring{position:fixed;inset:0;z-index:9500;display:grid;place-items:center;text-align:center;background:var(--hot);color:var(--on-hot);padding:24px;animation:flash .9s steps(2,jump-none) infinite}
@keyframes flash{to{background:#111;color:#fff}}
.ring .rbig{font-family:var(--title-font);font-weight:900;font-size:clamp(3.5rem,11vw,11rem);line-height:1.05}
.ring .rsub{font-family:var(--digit-font);font-size:clamp(1.4rem,3.2vw,3.2rem);margin-top:12px}
.ring button{margin-top:36px;font-size:1.4rem;padding:12px 40px;border-radius:999px;border:3px solid currentColor;background:transparent;color:inherit;cursor:pointer;font-weight:700}
.lightbox{position:fixed;inset:0;z-index:9400;background:rgba(0,0,0,.93);display:grid;place-items:center;cursor:zoom-out}
.lightbox img{max-width:97vw;max-height:95vh;object-fit:contain}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;z-index:9600;font-size:.95rem;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.4);display:flex;gap:12px;align-items:center}
.toast button{background:#fff;color:#111;border:0;border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:700}
.ack{position:fixed;inset:0;z-index:9450;display:grid;place-items:center;background:rgba(0,0,0,.35);padding:16px}
.ackbox{background:var(--card-solid);color:var(--ink);border:2px solid var(--accent);border-radius:16px;padding:22px 28px;max-width:min(520px,92vw);text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px;align-items:center}
.acktime{color:var(--muted);font-size:.95rem}
.ackmsg{font-family:var(--title-font);font-weight:700;font-size:clamp(1.4rem,3vw,2.2rem);line-height:1.35;white-space:pre-line;color:var(--accent)}
.ackbox .btn{font-size:1.15rem;padding:8px 34px}
.w.glow{animation:wglow 1.1s ease-in-out infinite;z-index:5000!important;cursor:pointer}
.w.glow .ms{color:var(--hot)!important;transform:scale(1.15)}
@keyframes wglow{0%,100%{box-shadow:0 0 0 3px var(--accent),0 0 18px 4px var(--accent)}50%{box-shadow:0 0 0 6px var(--accent),0 0 70px 26px var(--accent)}}
@media (prefers-reduced-motion:reduce){.ring,.urgent,.die.shake,.rres.got,.w.glow{animation:none}.w.glow{box-shadow:0 0 0 6px var(--accent),0 0 50px 16px var(--accent)}}

<script>
/* 螢幕公告（源自 classboard v3.5） */
(function(){
const $=s=>document.querySelector(s);
const KEY='classboard_v2',IMGKEY='classboard_v2_img';
const pad=n=>String(n).padStart(2,'0');

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toMin=t=>{const[a,b]=String(t).split(':').map(Number);return a*60+(b||0)};
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const fmt=s=>{s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+':'+pad(m)+':'+pad(x):pad(m)+':'+pad(x)};

const icons=()=>{try{window.lucide&&lucide.createIcons()}catch(e){}};
const WK='日一二三四五六';

function cdSoon(min){const t=new Date(Date.now()+min*60000);return String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')}

function cdTarget(d,now){const n=now?new Date(now):new Date(),[h,m]=d.time.split(':').map(Number),tg=new Date(n);tg.setHours(h||0,m||0,0,0);if(d.setAt&&tg.getTime()<=d.setAt)tg.setDate(tg.getDate()+1);return tg}

  const quiet=4,scale=8,n=code.size+quiet*2;c.width=c.height=n*scale;

}
const INIT={

  countdown:['倒數','hourglass',.3,.24], stopwatch:['碼錶','watch',.26,.3], alarm:['鬧鐘','alarm-clock',.22,.28], image:['圖片','image',.32,.38],
  random:['抽籤','shuffle',.28,.32], group:['分組','users',.4,.4], score:['計分板','trophy',.42,.32], poll:['投票','vote',.28,.34],

function unlock(){
  try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}
  const b=$('#soundTb');if(b){const ok=!!AC;b.classList.toggle('warn',!ok);b.querySelector('.lb').textContent=ok?'測試聲音':'開聲音'}
  if(!wake&&navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>{wake=w;w.addEventListener('release',()=>wake=null)}).catch(()=>{});
}

function beep(f,dur,when){if(!AC)return;const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.03)}
function chime(){beep(988,.15,0);beep(988,.15,.2);beep(1319,.32,.4)}

    if(fields.move){B('↑',()=>{const a=arr();if(i>0)[a[i-1],a[i]]=[a[i],a[i-1]]});B('↓',()=>{const a=arr();if(i<a.length-1)[a[i+1],a[i]]=[a[i],a[i+1]]})}

function place(el,W){el.classList.toggle('toped',W.y<.06);el.style.left=W.x*100+'%';el.style.top=W.y*100+'%';el.style.width=W.w*100+'%';el.style.height=W.h*100+'%';el.style.zIndex=10+W.z}
/* ---------- 畫筆 ---------- */
const INK_COLORS=[['#e53935','紅'],['#fb8c00','橘'],['#fdd835','黃'],['#43a047','綠'],['#1e88e5','藍'],['#8e24aa','紫'],['#111111','黑'],['#ffffff','白']];
const INK_SIZES=[['s','細',.004],['m','中',.008],['l','粗',.016]];
const INK={on:false,color:'#e53935',size:'m',tool:'pen',cur:null,undo:[]};
const inkCv=document.createElement('canvas');inkCv.id='ink';
const inkBar=document.createElement('div');inkBar.id='inkBar';inkBar.hidden=true;document.body.appendChild(inkBar);
const inkList=()=>{const sc=scr();if(!Array.isArray(sc.ink))sc.ink=[];return sc.ink};
function inkStroke(ctx,st,W,H){
  const p=st.p;if(p.length<2)return;
  ctx.globalAlpha=st.a||1;ctx.strokeStyle=ctx.fillStyle=st.c;ctx.lineWidth=Math.max(1,st.w*H);ctx.lineCap=ctx.lineJoin='round';
  if(p.length===2){ctx.beginPath();ctx.arc(p[0]*W,p[1]*H,ctx.lineWidth/2,0,Math.PI*2);ctx.fill();return}
  ctx.beginPath();ctx.moveTo(p[0]*W,p[1]*H);
  // 取相鄰兩點的中點畫曲線，線條才滑順
  for(let i=2;i<p.length-2;i+=2){const x=p[i]*W,y=p[i+1]*H;ctx.quadraticCurveTo(x,y,(x+p[i+2]*W)/2,(y+p[i+3]*H)/2)}
  ctx.lineTo(p[p.length-2]*W,p[p.length-1]*H);ctx.stroke();
}
function inkDraw(){

$('#bar').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.add){const added=addW(b.dataset.add);if(added.type==='qr')ELS[added.id].b.querySelector('.qrin').focus()}
  else if(b.id==='scrMgr'){$('#pop').hidden=true;$('#sched').hidden=true;$('#screens').hidden=!$('#screens').hidden;drawScreens()}
  else if(b.id==='scrPlus'){addScreen(S.cur);$('#pop').hidden=true;$('#sched').hidden=true;$('#screens').hidden=false;drawScreens(true)}
  else if(b.id==='scrPrev')goScr(S.cur-1);else if(b.id==='scrNext')goScr(S.cur+1);
  else if(b.id==='bgTb'){$('#sched').hidden=true;$('#screens').hidden=true;$('#pop').hidden=!$('#pop').hidden;drawLook();presetNote()}
  else if(b.id==='schedTb'){$('#pop').hidden=true;$('#screens').hidden=true;$('#sched').hidden=!$('#sched').hidden;drawJobs()}
  else if(b.id==='inkTb')inkToggle();
  else if(b.id==='fsTb')toggleFs();
  else if(b.id==='soundTb'){unlock();chime()}
  else if(b.id==='hideTb')toggleBar()};
function toggleBar(){const h=!$('#bar').classList.contains('hide');$('#bar').classList.toggle('hide',h);$('#barShow').hidden=!h;if(h)$('#pop').hidden=true}
$('#barShow').onclick=toggleBar;
function toggleFs(){const host=embedHost();if(host){host.fsToggle(host.document.getElementById('screenBoard'));return}if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else(document.documentElement.requestFullscreen?.()||Promise.reject()).catch(()=>toast('這裡不能切全螢幕，可以按 F11'))}
document.addEventListener('pointerdown',e=>{if(!$('#pop').hidden&&!e.target.closest('#pop,#bgTb'))$('#pop').hidden=true;if(!$('#sched').hidden&&!e.target.closest('#sched,#schedTb'))$('#sched').hidden=true;if(!$('#screens').hidden&&!e.target.closest('#screens,#scrMgr,#scrPlus,#scrPrev,#scrNext'))$('#screens').hidden=true});

/* ---------- 匯出／匯入 ---------- */
let DL=null;
async function saveFile(name,blob){
  try{if(!DL&&window.claude&&claude.use)DL=await claude.use('downloads')}catch(e){DL=null}
  if(DL){try{await DL.save({filename:name,data:blob});toast('已匯出 '+name);return}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('上一個下載還沒確認，請稍等');return}}}
  try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('已匯出 '+name)}
  catch(e){toast('這裡不能下載檔案，請改用離線版 HTML')}
}
const stamp=()=>{const n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())+'_'+pad(n.getHours())+pad(n.getMinutes())};
const safeName=t=>String(t).replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,40)||'畫面';
$('#expJson').onclick=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  saveFile('螢幕公告設定_'+stamp()+'.json',new Blob([JSON.stringify({app:'classboard',v:2,ver:'2.3',exported:new Date().toISOString(),S,IMG})],{type:'application/json'}))};
$('#impJson').onclick=()=>$('#jsonIn').click();
function presetNote(){const pr=readPreset();$('#presetNote').textContent=pr?(pr.builtin?'目前的預設：內建在網頁裡的設定。':'目前的預設：'+(pr.saved||'')+' 存的設定（只存在這台電腦的瀏覽器）。'):'還沒有存預設。存了以後，按「還原成預設」就會回到這個設定。'}
$('#presetSave').onclick=e=>armed(e.target,'把目前設定存為預設',()=>{try{const n=new Date();localStorage.setItem(PRESETKEY,JSON.stringify({app:'classboard',v:2,saved:n.getFullYear()+'/'+(n.getMonth()+1)+'/'+n.getDate()+' '+pad(n.getHours())+':'+pad(n.getMinutes()),S,IMG}));toast('已存為預設');presetNote()}catch(err){toast('存不下：圖片太多太大，請刪掉一些圖片再試')}});
$('#presetLoad').onclick=e=>armed(e.target,'還原成預設',()=>{const pr=readPreset();if(!pr){toast('還沒有存預設');return}S=JSON.parse(JSON.stringify(pr.S));IMG=JSON.parse(JSON.stringify(pr.IMG||{}));OPEN.clear();selId=null;save();saveImgs();applyStyle();goScr(S.cur||0);toast('已還原成預設')});
$('#jsonIn').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const fr=new FileReader();
  fr.onload=()=>{try{const o=JSON.parse(fr.result);if(o.app!=='classboard'||!o.S||!Array.isArray(o.S.screens))throw 0;
    S=o.S;IMG=o.IMG||{};S.screens.forEach(sc=>{sc.id=sc.id||uid();sc.widgets=sc.widgets.filter(w=>KEEP.includes(w.type))});
    S.cur=Math.min(S.cur||0,S.screens.length-1);S.jobs=S.jobs||[];S.rotate=S.rotate||{on:false,sec:30};S.bg=S.bg||'default';S.font=S.font||'auto';S.dfont=S.dfont||'auto';
    OPEN.clear();selId=null;save();saveImgs();applyStyle();renderScreen();$('#pop').hidden=true;toast('已匯入，共 '+S.screens.length+' 個畫面')}
    catch(err){toast('這不是本工具匯出的設定檔')}};fr.readAsText(f)};
$('#expPng').onclick=async()=>{
  if(!window.html2pdf){await new Promise(res=>{const t=document.createElement('script');t.src='assets/vendor/html2pdf.bundle.min.js';t.onload=res;t.onerror=res;document.head.appendChild(t)})}
  if(!window.html2pdf){toast('匯出工具載入失敗，請重新整理再試');return}
  $('#pop').hidden=true;document.body.classList.add('shot');await new Promise(r=>setTimeout(r,80));
  try{// html2pdf 會把畫布複製到紙張大小的容器：先把畫布固定成實際尺寸，紙張也設一樣大，匯出後還原
    const R=stage.getBoundingClientRect(),W=Math.round(R.width),H=Math.round(R.height),oldCss=stage.getAttribute('style');
    stage.style.width=W+'px';stage.style.height=H+'px';stage.style.position='relative';stage.style.inset='auto';
    let c;try{c=await html2pdf().set({margin:0,jsPDF:{unit:'px',format:[W,H],hotfixes:['px_scaling']},html2canvas:{backgroundColor:getComputedStyle(document.body).getPropertyValue('--bg').trim()||null,scale:Math.min(2,devicePixelRatio||1),useCORS:true,logging:false,width:W,height:H}}).from(stage).toCanvas().get('canvas')}
    finally{if(oldCss===null)stage.removeAttribute('style');else stage.setAttribute('style',oldCss)}
    c.toBlob(b=>{if(b)saveFile(safeName(scr().name)+'_'+stamp()+'.png',b);else toast('匯出圖片失敗')},'image/png')}
  catch(e){toast('匯出圖片失敗')}finally{document.body.classList.remove('shot')}
};

/* ---------- 定時 ---------- */
let lastRot=Date.now(),lastUser=0;
['pointerdown','keydown'].forEach(t=>document.addEventListener(t,()=>lastUser=Date.now()));
const ACTS=[['screen','切換畫面'],['notice','跳出公告'],['timer','開始計時器']];
function drawJobs(){
  const box=$('#jobs');box.innerHTML='';
  if(!S.jobs.length)box.innerHTML='<div class="pnote">還沒有定時。按「新增定時」，例如 9:00 自動切到「考試中」畫面。</div>';
  S.jobs.slice().sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')).forEach(j=>{
    const r=document.createElement('div');r.className='job'+(j.on?'':' off');
    r.innerHTML=`<button type="button" class="btn ${j.on?'primary':''}" data-a="on">${j.on?'開':'關'}</button><input type="time" id="jt-${j.id}" aria-label="時間"><select id="ja-${j.id}" aria-label="動作">${ACTS.map(([k,t])=>`<option value="${k}"${j.action===k?' selected':''}>${t}</option>`).join('')}</select><button type="button" class="btn danger" data-a="del">刪除</button><div class="pm"></div>`;
    r.querySelector('input[type=time]').value=j.time||'';
    r.querySelector('input[type=time]').onchange=e=>{j.time=e.target.value;j.fired='';save()};
    r.querySelector('select').onchange=e=>{j.action=e.target.value;j.fired='';save();drawJobs()};
    r.querySelector('[data-a=on]').onclick=()=>{j.on=!j.on;j.fired='';save();drawJobs();drawBar();icons()};
    r.querySelector('[data-a=del]').onclick=()=>{S.jobs.splice(S.jobs.indexOf(j),1);save();drawJobs();drawBar();icons()};
    const pm=r.querySelector('.pm');
    if(j.action==='screen'){
      if(!S.screens.some(x=>x.id===j.screen))j.screen=S.screens[0].id;
      pm.innerHTML='到 <select id="js-'+j.id+'">'+S.screens.map(x=>`<option value="${x.id}"${x.id===j.screen?' selected':''}>${esc(x.name)}</option>`).join('')+'</select>';
      pm.querySelector('select').onchange=e=>{j.screen=e.target.value;save()};
    }else if(j.action==='notice'){
      pm.innerHTML=`<input type="text" id="jx-${j.id}" placeholder="要跳出的公告文字"><label><input type="checkbox" id="jb-${j.id}"> 響鈴</label>`;
      const t=pm.querySelector('input[type=text]');t.value=j.text||'';t.oninput=()=>{j.text=t.value;save()};
      const c=pm.querySelector('input[type=checkbox]');c.checked=!!j.sound;c.onchange=()=>{j.sound=c.checked;save()};
    }else{
      const tm=[];S.screens.forEach(x=>x.widgets.forEach(w=>{if(w.type==='timer')tm.push([w.id,x.name+'・'+(w.d.label||'計時器')+'（'+fmt(w.d.total)+'）'])}));
      if(!tm.length){pm.innerHTML='<span class="pnote">目前沒有計時器，先從工具列加一個。</span>'}
      else{if(!tm.some(x=>x[0]===j.timer))j.timer=tm[0][0];
        pm.innerHTML='<select id="jw-'+j.id+'">'+tm.map(([id,t])=>`<option value="${id}"${id===j.timer?' selected':''}>${esc(t)}</option>`).join('')+'</select><label><input type="checkbox" id="jb-'+j.id+'"> 開始時響一聲</label>';
        pm.querySelector('select').onchange=e=>{j.timer=e.target.value;save()};
        const c=pm.querySelector('input[type=checkbox]');c.checked=!!j.sound;c.onchange=()=>{j.sound=c.checked;save()}}
    }
    box.appendChild(r)});
  $('#rotOn').checked=S.rotate.on;$('#rotSec').value=S.rotate.sec;
}
$('#jobAdd').onclick=()=>{const n=new Date();n.setMinutes(n.getMinutes()+5);S.jobs.push({id:uid(),on:true,time:pad(n.getHours())+':'+pad(n.getMinutes()),action:'screen',screen:scr().id,text:'',sound:true,fired:''});save();drawJobs();drawBar();icons()};
$('#rotOn').onchange=e=>{S.rotate.on=e.target.checked;lastRot=Date.now();save()};
$('#rotSec').onchange=e=>{S.rotate.sec=clamp(+e.target.value||30,5,3600);e.target.value=S.rotate.sec;save()};
let noticeT,lastIv='';const GLOW={};
function fireIv(W,key){const d=W.d;
  if((d.how||'pop')==='glow'){GLOW[W.id]=Date.now()+(d.auto>0?d.auto:600)*1000;T.interval.glowTick(W);if(d.sound&&lastIv!==key)chime();if(key)lastIv=key;return}
  if(!key||lastIv!==key){if(key)lastIv=key;notice(d.msg||'提醒',d.sound,d.auto)}}
document.addEventListener('click',e=>{const el=e.target.closest('.w.glow');if(!el||e.target.closest('.wh,.wr,button'))return;
  const W=allW().find(w=>w.id===el.dataset.id);if(!W)return;e.stopPropagation();
  $('#ackMsg').textContent=W.d.msg||'提醒';const n=new Date();$('#ackTime').textContent=pad(n.getHours())+':'+pad(n.getMinutes())+' 的提醒';
  $('#ack').dataset.id=W.id;$('#ack').hidden=false;$('#ackOk').focus()},true);
function ackOk(){const id=$('#ack').dataset.id;$('#ack').hidden=true;if(!id)return;
  const W=allW().find(w=>w.id===id);const msg=W&&W.d.msg;
  allW().forEach(w=>{if(w.type==='interval'&&(w.id===id||w.d.msg===msg)){delete GLOW[w.id];const o=ELS[w.id];if(o)o.el.classList.remove('glow')}})}
$('#ackOk').onclick=ackOk;$('#ack').onclick=e=>{if(e.target.id==='ack')$('#ack').hidden=true};
function notice(text,sound,auto){ringOff();const r=$('#ring');r.classList.add('calm');$('#ringBig').textContent=text;const n=new Date();$('#ringSub').textContent=pad(n.getHours())+':'+pad(n.getMinutes())+(auto>0?'　（'+auto+' 秒後自動關閉）':'');r.hidden=false;if(sound)chime();clearTimeout(noticeT);if(auto>0)noticeT=setTimeout(()=>{if(r.classList.contains('calm'))ringOff()},auto*1000)}
function runJob(j){
  if(j.action==='screen'){const i=S.screens.findIndex(x=>x.id===j.screen);if(i>=0)goScr(i)}
  else if(j.action==='notice')notice(j.text||'公告',j.sound);
  else if(j.action==='timer'){S.screens.forEach((x,si)=>{const W=x.widgets.find(w=>w.id===j.timer);if(!W)return;if(si!==S.cur)goScr(si);
    const d=W.d;d.remain=d.total;d.endAt=Date.now()+d.total*1000;d.running=true;save();if(j.sound)chime();toast('定時開始：'+(d.label||'計時器')+' '+fmt(d.total))})}
}

/* ---------- 快捷鍵 ---------- */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#ack').hidden){ackOk();return}
  if(e.key==='Enter'&&!$('#ack').hidden){e.preventDefault();ackOk();return}
  if(e.key==='Escape'&&INK.on&&$('#ring').hidden){inkToggle(false);return}
  if(e.key==='Escape'){ringOff();$('#lightbox').hidden=true;$('#pop').hidden=true;$('#sched').hidden=true;$('#screens').hidden=true;return}
  if(isTyping(e.target)||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();
  if(k==='b')toggleBar();else if(k==='f')toggleFs();else if(k==='p')inkToggle();
  else if(e.key==='ArrowRight')goScr(S.cur+1);else if(e.key==='ArrowLeft')goScr(S.cur-1);
  else if(k===' '){const W=scr().widgets.find(w=>w.id===selId)||scr().widgets.find(w=>w.type==='timer');if(W&&T[W.type].primary){e.preventDefault();T[W.type].primary(ELS[W.id].b,W)}}
});

/* ---------- 主迴圈：所有畫面的計時器、鬧鐘、倒數都會照常響 ---------- */
function loop(){
  const n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes()),tk=todayKey(),now=Date.now();
  for(const W of allW()){const d=W.d;
    if(W.type==='timer'&&d.running&&d.endAt<=now){d.running=false;d.remain=0;save();ring(d.label?d.label+' 時間到！':'時間到！','計時 '+fmt(d.total)+' 結束')}
    if(W.type==='alarm')d.list.forEach(a=>{if(a.on&&a.time===hm&&a.fired!==tk){a.fired=tk;save();ring(a.label||'鬧鐘',a.time)}});
    if(W.type==='countdown'&&d.fired!==tk){const at=cdTarget(d).getTime();if(now>=at&&now-at<60000){d.fired=tk;save();ring(d.done||'時間到',d.label)}}
  }
  S.jobs.forEach(j=>{if(j.on&&j.time===hm&&j.fired!==tk){j.fired=tk;save();runJob(j)}});
  for(const W of allW()){if(W.type!=='interval'||!W.d.on)continue;const d=W.d,nx=T.interval.next(d,now-1000);if(nx&&nx<=now&&now-nx<5000&&d.fired!==String(nx)){d.fired=String(nx);save();fireIv(W,nx+'|'+d.msg)}}
  for(const W of scr().widgets)if(W.type==='interval')T.interval.glowTick(W);
  if(S.rotate.on&&S.screens.length>1&&$('#ring').hidden&&!OPEN.size&&$('#pop').hidden&&$('#sched').hidden&&$('#screens').hidden&&now-lastUser>20000&&now-lastRot>S.rotate.sec*1000)goScr(S.cur+1);
  for(const W of scr().widgets){const o=ELS[W.id];if(o&&T[W.type].tick&&!OPEN.has(W.id))T[W.type].tick(o.b,W)}
}

applyStyle();renderScreen();loop();setInterval(loop,200);
// 定時跳出提醒時，大屏切到這個工具，老師和學生才看得到
['#ring','#ack'].forEach(sel=>new MutationObserver(()=>{const host=embedHost();if(host&&!$(sel).hidden&&host.screenBoardShow)host.screenBoardShow()}).observe($(sel),{attributes:true,attributeFilter:['hidden']}));
addEventListener('load',icons);
})();
</script>
