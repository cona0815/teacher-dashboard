<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root { color-scheme: light; --ink:#17212b; --muted:#687583; --line:#d9e0e6; --brand:#185b8d; --soft:#f4f7f9; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; color: var(--ink); background: #fff; font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
    h1 { margin: 0; font-size: 24px; }
    .intro { margin: 7px 0 20px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { display: grid; gap: 6px; }
    .wide { grid-column: 1 / -1; }
    label { font-size: 13px; font-weight: 800; }
    select, input { width: 100%; min-height: 42px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font: inherit; }
    .profile { min-height: 88px; margin-top: 15px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); color: var(--muted); font-size: 13px; line-height: 1.6; }
    .profile strong { display: block; margin-bottom: 5px; color: var(--ink); }
    .check { display: flex; align-items: flex-start; gap: 9px; margin-top: 15px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .check input { width: 17px; min-height: 17px; margin-top: 1px; }
    .notice { margin-top: 14px; padding: 11px 13px; border-left: 4px solid var(--brand); background: #eef6fb; color: #365064; font-size: 13px; line-height: 1.55; }
    .actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; }
    button { min-height: 40px; padding: 8px 16px; border: 0; border-radius: 8px; font: inherit; font-weight: 800; cursor: pointer; }
    .secondary { background: #e9edf0; color: var(--ink); }
    .primary { background: var(--brand); color: #fff; }
    button:disabled { cursor: wait; opacity: .6; }
    .status { min-height: 22px; margin-top: 12px; color: var(--muted); font-size: 13px; }
    .status.error { color: #a22424; }
    @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } .wide { grid-column: auto; } }
  </style>
</head>
<body>
  <h1>設定你的校務任務系統</h1>
  <p class="intro">這裡只設定學校名稱與主要工作身分。系統保留「教學、行政、學年主任、導師」四大工作主軸，不再要求先選擇細部處室。</p>

  <div class="grid">
    <div class="field wide">
      <label for="schoolName">學校名稱（選填）</label>
      <input id="schoolName" maxlength="100" placeholder="例如：○○市立○○國民中學">
    </div>
    <div class="field">
      <label for="role">主要工作身分</label>
      <select id="role"></select>
    </div>
  </div>

  <div class="profile" id="profile">正在載入教師工作台設定……</div>

  <label class="check">
    <input id="seedSamples" type="checkbox" checked>
    <span>全新空白工作表加入 3 筆教師工作範例任務（已有任務時不會覆蓋或重複加入）</span>
  </label>

  <div class="notice">行政仍可直接作為工作身分與工作主軸使用；舊版若曾設定處室，既有任務與類型會保留，欄位需要遷移時也會先建立隱藏備份。</div>

  <div class="actions">
    <button class="secondary" type="button" onclick="google.script.host.close()">取消</button>
    <button class="primary" id="installButton" type="button">安裝／套用</button>
  </div>
  <div class="status" id="status"></div>

  <script>
    'use strict';
    let roles = [];
    let installToken = '';
    const $ = id => document.getElementById(id);

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function callServer(functionName, ...args) {
      return new Promise((resolve, reject) => {
        const runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(error => reject(new Error(error && error.message ? error.message : String(error))));
        runner[functionName](...args);
      });
    }

    function renderRoles() {
      const previousRole = $('role').value;
      $('role').innerHTML = roles
        .map(role => `<option value="${escapeHtml(role.key)}">${escapeHtml(role.name)}</option>`)
        .join('');
      if (roles.some(role => role.key === previousRole)) $('role').value = previousRole;
    }

    async function initialize() {
      try {
        const data = await callServer('getInstallationOptions');
        roles = data.roles || [];
        installToken = data.installToken || '';
        $('schoolName').value = data.current.schoolName || '';
        renderRoles();
        const profile = data.profile || {};
        $('profile').innerHTML = `
          <strong>${escapeHtml(profile.name || '國小教師工作台')}</strong>
          <span>${escapeHtml(profile.description || '教學、行政、學年主任與導師四大工作主軸共用同一個教師工作台。')}</span>`;
        if ([...$('role').options].some(option => option.value === data.current.roleKey)) {
          $('role').value = data.current.roleKey;
        }
      } catch (error) {
        $('status').textContent = error.message;
        $('status').classList.add('error');
        $('installButton').disabled = true;
      }
    }

    async function install() {
      const button = $('installButton');
      button.disabled = true;
      $('status').classList.remove('error');
      $('status').textContent = '正在建立工作表、設定任務類型與觸發器……';
      try {
        const result = await callServer(
          'installOfficeSystem',
          'teacher_workspace',
          $('role').value,
          $('schoolName').value,
          $('seedSamples').checked,
          installToken,
        );
        $('status').textContent = `${result.message} 視窗即將關閉。`;
        window.setTimeout(() => google.script.host.close(), 1200);
      } catch (error) {
        $('status').textContent = error.message;
        $('status').classList.add('error');
        button.disabled = false;
      }
    }

    $('installButton').addEventListener('click', install);
    initialize();
  </script>
</body>
</html>
